<style>
* {
  box-sizing: border-box;
}

  color-scheme: dark;

  place-items: center;
  background: #060f0b;
  color: #e9fff4;
  font: 14px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  width: min(320px,calc(100% - 48px));
  display: grid;
  justify-items: center;
  gap: 13px;
  animation: enter .45s cubic-bezier(.22,1,.36,1) both;
}
svg {
  width: 42px;
  height: 42px;
}
h1 {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.035em;
  margin: 0;
}
#bar {
  width: 72px;
  height: 2px;
  background: #1f3d2d;
  border-radius: 2px;
  overflow: hidden;
  margin-top: 10px;
}
#bar:before {
  display: block;
  content: "";
  width: 100%;
  height: 100%;
  background: #34f59a;
  transform-origin: left;
  animation: load .72s cubic-bezier(.22,1,.36,1) both;
}
form {
  display: grid;
  gap: 10px;
  width: 100%;
  margin-top: 9px;
  animation: enter .35s cubic-bezier(.22,1,.36,1) both;
}
form[hidden],#bar[hidden] {
  display: none;
}
input,button {
  font: inherit;
  width: 100%;
  height: 44px;
  border-radius: 12px;
}
input {
  background: #0d1b14;
  color: #e9fff4;
  border: 1px solid #1f3d2d;
  padding: 0 13px;
  outline: none;
  transition: border-color .2s,box-shadow .2s;
}
input::placeholder {
  color: #7da592;
}
input:focus {
  border-color: #34f59a;
  box-shadow: 0 0 0 3px #34f59a18;
}
input[aria-invalid=true] {
  border-color: #ff5d6e;
}
button {
  border: 0;
  background: #34f59a;
  color: #032;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s,opacity .2s;
}
button:active {
  transform: scale(.98);
}
button:disabled {
  opacity: .65;
  cursor: wait;
}
button:focus-visible {
  outline: 2px solid #e9fff4;
  outline-offset: 3px;
}
#msg {
  min-height: 1.2em;
  text-align: center;
  margin: 0;
  color: #ff5d6e;
  font-size: 12px;
}
main.exit {
  animation: exit .22s ease both;
}
form.wrong {
  animation: shake .28s ease;
}
@keyframes load {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes exit {
  to {
    opacity: 0;
    transform: translateY(-5px);
  }
}
@keyframes shake {
  25% {
    transform: translateX(-4px);
  }
  50% {
    transform: translateX(4px);
  }
  75% {
    transform: translateX(-2px);
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*:before {
    animation: none!important;
    transition: none!important;
  }
}
</style>
</head>

    if (!SOLUSD || now-SOL_TS>=120000) $('#sol').textContent='SOL –';
    let ok = 0;
    const rows = Object.values(SRC).map(s => {
        const live = s.ok && (s === SRC.ws
            ? !!ws && ws.readyState === 1 && now - s.t < WS_STALE_MS
            : now - s.t < 18e4);
        if (live)
            ok++;
        return `<div><i class="live${live ? '' : s.ok === false ? ' bad' : ' off'}"></i><b>${s.name}</b><small>${live ? (s.c || 0) + ' items · ' + age(s.t) + ' ago' : s.ok === null ? 'waiting' : esc(s.err || 'idle')}</small></div>`;
    }).join('');
    $('#pop').innerHTML = rows;
    $('#srct').textContent = ok + '/' + Object.keys(SRC).length + ' sources';
    $('#lv').className = 'live' + (ok >= 3 ? '' : ok >= 1 ? ' off' : ' bad');
}

/* search: every source at once, results merged into the same store */
async function search(k) {
    const mint = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(k), u = [DS + '/latest/dex/search?q=' + encodeURIComponent(k), JUP + '/search?query=' + encodeURIComponent(k), 'https://api.geckoterminal.com/api/v2/search/pools?query=' + encodeURIComponent(k) + '&network=solana'];
    if (mint) {
        u.push(DS + '/tokens/v1/solana/' + k);
        need.add(k);
    }
    const R = await Promise.allSettled(u.map(x => J(x)));
    if (k !== q)
        return;
    R.forEach((x, i) => {
        if (x.status !== 'fulfilled')
            return;
        const v = x.value;
        if (i === 1 && Array.isArray(v)) {
            v.forEach(y => mapJup(y, 1));
            mark('jup', true);
        }
        else if (v && Array.isArray(v.data)) {
            v.data.forEach(d => mapGt(d, 1));
            mark('gt', true);
        }
        else {
            (Array.isArray(v) ? v : v && v.pairs || []).forEach(p => mapDex(p, 1));
            mark('dex', true);
        }
    });
    refreshList(true);
}

}

}

<script>
// Local password screen: cosmetic access gate, not real authentication.
(() => {
    "use strict";
    const screen = document.querySelector("main");
    const form = screen.querySelector("form");
    const password = form.querySelector("input");
    const button = form.querySelector("button");
    const message = form.querySelector("p");
    const bar = document.querySelector("#bar");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Store a salted password verifier, never the plaintext password.
    const PASSWORD_SALT = "ca5b38f60c99815f864e9c6f174f4e88";
    const PASSWORD_HASH = "f4f6b0a1bca6d13cb315265b61dec97bd88b47707f13942714ffb8969aad104b";
    const PASSWORD_ROUNDS = 210000;
    async function verifyPassword(value) {
        if (!globalThis.crypto?.subtle)
            throw new Error("Password verification requires a secure browser context.");
        const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(value), "PBKDF2", false, ["deriveBits"]);
        const salt = Uint8Array.from(PASSWORD_SALT.match(/../g), byte => parseInt(byte, 16));
        const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt, iterations: PASSWORD_ROUNDS}, key, 256);
        const hash = Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, "0")).join("");
        return hash === PASSWORD_HASH;
    }
    let busy = false;
    setTimeout(() => {
        bar.hidden = true;
        form.hidden = false;
    }, reducedMotion ? 0 : 720);
    password.oninput = () => {
        message.textContent = "";
        password.removeAttribute("aria-invalid");
    };
    form.onsubmit = async event => {
        event.preventDefault();
        if (busy)
            return;
        busy = true;
        button.disabled = true;
        password.readOnly = true;
        let valid;
        try {
            valid = await verifyPassword(password.value);
        } catch (error) {
            message.textContent = "Password verification unavailable. Open this file locally or use HTTPS.";
            busy = false;
            button.disabled = false;
            password.readOnly = false;
            return;
        }
        if (!valid) {
            busy = false;
            button.disabled = false;
            password.readOnly = false;
            message.textContent = "Incorrect password.";
            password.setAttribute("aria-invalid", "true");
            form.classList.remove("wrong");
            void form.offsetWidth;
            form.classList.add("wrong");
            password.focus();
            password.select();
            return;
        }
        busy = true;
        button.disabled = true;
        password.readOnly = true;
        button.textContent = "Unlocking…";
        message.textContent = "";
        password.value = "";
        screen.classList.add("exit");
        const styles = document.getElementById("dashboard-styles").innerHTML;
        const markup = document.getElementById("dashboard-markup").innerHTML;
        const html = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060f0b"><title>Trench Radar</title>' + styles + "</head><body>" + markup + "</body></html>";
        setTimeout(() => {
            document.open();
            document.write(html);
            document.close();
        }, reducedMotion ? 0 : 220);
    };
})();
</script>
